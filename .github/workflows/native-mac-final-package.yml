name: native-mac-final-package

on:
  push:
    branches: [fix/all-workflow-parity]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gat-final-package-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

jobs:
  exact-package-install:
    name: Exact candidate build, native install, startup and all macro registrations
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build exact clean source and both isolated arm64 workers
        run: |
          test "$(uname -m)" = arm64
          test -z "$(git status --porcelain --untracked-files=no)"
          mvn -B -ntp -DskipTests clean package
          mvn -B -ntp -f native-inference/pom.xml clean package
          mvn -B -ntp -f native-alignment/pom.xml clean package
          python scripts/package-apple-silicon-preview.py --output "$PWD/final-package-artifacts"
      - name: Test package and installation gate safeguards
        run: |
          python -m pip install numpy==2.2.6 tifffile==2025.5.10 Pillow==11.2.1
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python -m unittest discover -s validation/fiji-install -p 'test_*.py' -v
      - name: Preserve the exact unreleased candidate independently of install outcome
        if: ${{ !cancelled() && hashFiles('final-package-artifacts/GAT-*-macos-arm64-preview.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gat-unreleased-final-candidate-${{ github.sha }}
          path: |
            final-package-artifacts/GAT-*-macos-arm64-preview.zip
            final-package-artifacts/GAT-*-macos-arm64-preview.zip.sha256
          if-no-files-found: error
      - name: Fresh official native Fiji install, actual startup and exact registrations
        run: |
          shopt -s nullglob
          archives=(final-package-artifacts/GAT-*-macos-arm64-preview.zip)
          test "${#archives[@]}" = 1
          python validation/fiji-install/run_fresh_fiji.py --installation-only \
            --fork-archive "$PWD/${archives[0]}" --fork-commit "$(git rev-parse HEAD)" \
            --output "$PWD/final-package-evidence"
      - name: Preserve install-only evidence without claiming scientific workflow coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gat-final-package-install-evidence-${{ github.sha }}
          path: |
            final-package-evidence/**/*.json
            final-package-evidence/**/*.log
            final-package-evidence/**/*.xml.gz
          if-no-files-found: error
