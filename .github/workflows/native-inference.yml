name: native-inference

on:
  push:
    branches: [main, feat/apple-silicon-stardist]
    # Publishing immutable reports must not restart expensive native runners.
    paths:
      - '.github/workflows/native-inference.yml'
      - 'native-inference/pom.xml'
      - 'native-inference/LICENSE*'
      - 'native-inference/THIRD_PARTY_NOTICES.md'
      - 'native-inference/README.md'
      - 'native-inference/src/**'
      - 'native-inference/validation/cross-platform/**'
      - 'native-inference/validation/moved-center/**'
      - 'native-inference/validation/nms/**'
      - 'scripts/validate-native-worker.py'
      - '!native-inference/validation/**/results/**'
  pull_request:
    branches: [main, gat_v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gat-native-inference-${{ github.ref }}
  # Preserve a native run that already acquired a hosted runner.
  cancel-in-progress: false

jobs:
  worker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            architecture: x64
            java: '17'
          - os: macos-14
            platform: macosx-arm64
            architecture: aarch64
            java: '17'
          - os: macos-15
            platform: macosx-arm64
            architecture: aarch64
            java: '21'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Record actual architecture
        run: |
          uname -a
          java -XshowSettings:properties -version 2>&1 | grep -E 'os.arch|java.version'
          if [ '${{ matrix.platform }}' = macosx-arm64 ]; then
            test "$(uname -m)" = arm64
          fi
      - name: Build and test isolated worker
        run: mvn -B -ntp -f native-inference/pom.xml clean package -Dtensorflow.platform=${{ matrix.platform }}
      - name: Fetch pinned author's model fixtures
        run: |
          mkdir -p target/model-fixtures
          base=https://raw.githubusercontent.com/pr4deepr/GutAnalysisToolbox/61d57c4e4bcfe82aa0369100c0a3b0739b70affa/Models
          curl --fail --location --retry 3 "$base/2D_enteric_neuron_v4_1.zip" -o target/model-fixtures/2D_enteric_neuron_v4_1.zip
          curl --fail --location --retry 3 "$base/2D_enteric_neuron_subtype_v4.zip" -o target/model-fixtures/2D_enteric_neuron_subtype_v4.zip
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              '2D_enteric_neuron_v4_1.zip': '114585480a0f0138749f9b23f8fd7150f80b5788105b4f23bc1f22ab74c79276',
              '2D_enteric_neuron_subtype_v4.zip': '49283bb2423bd9efcd4c88cae4011fd50ff1f5b519d5c71e9d24afa28f3641b8',
          }
          for name, digest in expected.items():
              assert hashlib.sha256((Path('target/model-fixtures') / name).read_bytes()).hexdigest() == digest, name
          PY
      - name: Run both real models with native CPU backend
        run: python3 scripts/validate-native-worker.py --worker native-inference/target/gat-native-inference.jar --models target/model-fixtures
      - name: Test strict fixture comparator failure paths
        run: python3 -m unittest discover -s native-inference/validation/cross-platform -p 'test_*.py' -v
      - name: Compare real Hu inference and unchanged NMS to TensorFlow 1.15 references
        run: >-
          python3 native-inference/validation/cross-platform/check.py
          --worker native-inference/target/gat-native-inference.jar
          --models target/model-fixtures
          --output target/cross-platform-${{ matrix.platform }}
      - name: Test moved-center diagnostic integrity checks
        run: python3 -m unittest discover -s native-inference/validation/moved-center -p 'test_*.py' -v
      - name: Measure the fixed moved-center outlier against both archived runtimes
        run: >-
          python3 native-inference/validation/moved-center/check.py
          --worker native-inference/target/gat-native-inference.jar
          --models target/model-fixtures
          --output target/moved-center-${{ matrix.platform }}
      - name: Save moved-center diagnostics (completion is not equivalence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gat-moved-center-${{ matrix.platform }}-jdk${{ matrix.java }}
          path: |
            target/moved-center-${{ matrix.platform }}/report.json
            target/moved-center-${{ matrix.platform }}/actual.nms.json
            target/moved-center-${{ matrix.platform }}/actual.polygons.gz
          if-no-files-found: warn
      - name: Save cross-platform scientific regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gat-real-fixture-${{ matrix.platform }}-jdk${{ matrix.java }}
          path: |
            target/cross-platform-${{ matrix.platform }}/comparison.json
            target/cross-platform-${{ matrix.platform }}/*.nms.json
            target/cross-platform-${{ matrix.platform }}/*.labels.u16be
            target/cross-platform-${{ matrix.platform }}/*.probability.f32be
          if-no-files-found: warn
      - name: Save matching-platform worker bundle and test reports
        uses: actions/upload-artifact@v4
        with:
          name: gat-worker-${{ matrix.platform }}-jdk${{ matrix.java }}
          path: |
            native-inference/target/gat-native-inference-${{ matrix.platform }}.zip
            native-inference/target/surefire-reports/
          if-no-files-found: error
